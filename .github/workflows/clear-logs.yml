name: "Clear logs"
on:
  workflow_dispatch:
    inputs:
      groups:
        type: string
        description: "Which data groups to clear. Comma-separated only: logs, devices, carts, business"
        required: true
        default: "logs,devices,carts,business"
      apply:
        type: boolean
        description: "Dry run unless true. Dry run counts rows; apply deletes them and backs the deleted rows up first."
        required: false
        default: false
      _reconcile:
        type: boolean
        description: "Internal. Ignored; used only to force GitHub to re-read this workflow's definition."
        required: false
        default: true
      backupDir:
        type: string
        description: "Optional backup directory. Defaults to backups/cleared-<timestamp>."
        required: false
        default: ""

# The only runner registered for this repo is a Windows self-hosted one, and it
# has no PowerShell 7: without a pinned shell every run step falls back to
# Windows PowerShell while these steps are written as bash.
defaults:
  run:
    shell: bash

jobs:
  # The job id must stay a bare identifier; the readable title goes in `name`.
  # The old id was "Clear logs (dry run unless apply)", and GitHub rejects
  # spaces and parentheses in a job id, so this workflow never parsed at all.
  clear:
    name: Clear logs (dry run unless apply)
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jxgmbodzkmxanuwfaqxo.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROUPS: ${{ inputs.groups }}
      APPLY: ${{ inputs.apply }}
      BACKUP_DIR: ${{ inputs.backupDir }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 2026-11-19: run 44464152377 failed on app_logs with a bare PostgREST
      # 401, and the only real cause is the SUPABASE_SERVICE_ROLE_KEY secret --
      # either stale, expired, or disabled. The script now rejects a missing key
      # before touching any table, so fail here for the same audience that would
      # otherwise only see the 401 deep in the logs.
      - name: "Validate the service-role secret"
        id: svc
        run: |
          set -e
          echo "SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set. Refresh it in GitHub Settings > Secrets and variables > Actions with the service_role key from the Supabase dashboard for project jxgmbodzkmxanuwfaqxo:"
            echo "::error::https://supabase.com/dashboard/project/jxgmbodzkmxanuwfaqxo/settings/api"
            echo "::error::service_role key, the value under API keys."
            echo "::error::A 401 again means that key is stale, expired, or disabled; re-pasting the current one unblocks the next dispatch."
            exit 1
          fi
          echo "SUPABASE_SERVICE_ROLE_KEY=[SET] length ${#SUPABASE_SERVICE_ROLE_KEY}"

      - name: "Clear (backup first)"
        run: |
          set -e
          BACKUP="${BACKUP_DIR:-backup-$(date -u +%Y%m%dT%H%M%SZ)}"
          if [ "$APPLY" = "true" ]; then
            node scripts/clear-user-data.mjs --groups "$GROUPS" --apply --yes --backup="$BACKUP"
            echo "BACKUP_DIR=$BACKUP" >> "$GITHUB_ENV"
          else
            node scripts/clear-user-data.mjs --groups "$GROUPS"
          fi

      - name: "Upload the deleted rows"
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: cleared-rows-${{ github.run_number }}
          path: ${{ env.BACKUP_DIR }}
          retention-days: 30
          if-no-files-found: error
