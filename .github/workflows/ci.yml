name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Preview builds some pages with Supabase reachability; provide a fake
      # but well-formed value so static rendering does not short-circuit.
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      # Full history required: gitleaks-action resolves the pushed commit
      # range (BASE^..HEAD), which fails on a shallow clone (git exit 128).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  edge-relay:
    name: Edge function typecheck (car-relay)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # tsconfig.json EXCLUDES supabase/functions, so the car-relay edge function
    # is invisible to `npm run typecheck` - and an edge function that does not
    # compile is not a rounding error: it deploys, and then every WS upgrade
    # fails at runtime with nothing in CI red. This job is the only thing that
    # type-checks it.
    #
    # continue-on-error is DELIBERATE and temporary: this bench has no Deno, so
    # the first clean run has not been seen. Remove this line once it has, and
    # treat a failure here as a real failure from then on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check the relay function and its pure core
        run: deno check supabase/functions/car-relay/index.ts
      # Formatting is NOT re-checked here: prettier owns it repo-wide (a second
      # formatter with different defaults would be a second source of truth).
