name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Preview builds some pages with Supabase reachability; provide a fake
      # but well-formed value so static rendering does not short-circuit.
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      # Full history required: gitleaks-action resolves the pushed commit
      # range (BASE^..HEAD), which fails on a shallow clone (git exit 128).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Catalog parity — the app ships a GENERATED copy of THIS repo's fallback
  # catalog (lib/catalog-data.ts + lib/catalog-extras-data.ts). The app repo
  # regenerates and diffs that copy in its own CI, but that check only runs on
  # app pushes: a website-only catalog change never triggers it, so the two
  # surfaces could drift silently (wrong /about numbers offline). This job
  # closes that gap by regenerating the app's copy FROM this checkout and
  # failing when the committed copy differs.
  catalog-parity:
    name: App bundled catalog matches this repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      # Public repo, so the job's default token can clone it.
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: genumsolutions/genumsolutions-app
          path: app

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json

      - name: Install app dependencies
        working-directory: app/mobile
        run: npm ci

      # The generator lives in the app and imports this repo's data files
      # directly, so no website build/install is needed. Path: from
      # app/mobile, "../.." is the workspace root (this website checkout).
      - name: Regenerate the app catalog from this checkout
        working-directory: app/mobile
        run: npx --yes tsx scripts/generate-bundled-catalog.mts --website ../..

      - name: Fail when the app copy is stale
        working-directory: app
        run: |
          if ! git diff --quiet -- mobile/src/config/bundledProducts.ts; then
            echo "::error::mobile/src/config/bundledProducts.ts is stale — this website catalog change is not mirrored into the app. From genumsolutions-app/mobile run 'npx tsx scripts/generate-bundled-catalog.mts' and commit the result."
            git diff --stat -- mobile/src/config/bundledProducts.ts
            git --no-pager diff -- mobile/src/config/bundledProducts.ts | head -80
            exit 1
          fi
          echo "app bundled catalog matches this website's fallback catalog"

  edge-relay:
    name: Edge function typecheck (car-relay)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # tsconfig.json EXCLUDES supabase/functions, so the car-relay edge function
    # is invisible to `npm run typecheck` - and an edge function that does not
    # compile is not a rounding error: it deploys, and then every WS upgrade
    # fails at runtime with nothing in CI red. This job is the only thing that
    # type-checks it.
    #
    # It was advisory (continue-on-error) for exactly one run, because this
    # bench has no Deno and an unproven gate is not a gate. First clean run on
    # 2026-10-05 (run 37282380295, 495bae4): green. It now BLOCKS, and a
    # failure here is a real failure - index.ts compiles nowhere else.
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check the relay function and its pure core
        run: deno check supabase/functions/car-relay/index.ts
      # Formatting is NOT re-checked here: prettier owns it repo-wide (a second
      # formatter with different defaults would be a second source of truth).
