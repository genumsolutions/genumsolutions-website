name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The only runner registered for this repo is a Windows self-hosted one, and
# it has no PowerShell 7: without a pinned shell every `run:` step falls back
# to Windows PowerShell while these steps are written as bash.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality checks
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      # Preview builds some pages with Supabase reachability; provide a fake
      # but well-formed value so static rendering does not short-circuit.
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      # Full history required: gitleaks-action resolves the pushed commit
      # range (BASE^..HEAD), which fails on a shallow clone (git exit 128).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Production build
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Browser parity — tests/parity-projects.spec.ts drives a real Chromium
  # against the PRODUCTION build, not the dev server: the job builds here and
  # `playwright.config.ts` starts `npm run start` in CI, so the suite checks
  # what actually ships. The placeholder Supabase values are the same ones the
  # `build` job uses, which makes the catalog read fall back to
  # lib/catalog-data.ts — exactly what the spec needs (a project package and
  # its detail page) without depending on the live database.
  e2e-parity:
    name: E2E parity (Playwright)
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://genumsolutions-website.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the parity suite against the build
        run: npm run test:e2e

      # Traces and DOM snapshots only exist for failures (trace: on-first-retry).
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Catalog parity — the app ships a GENERATED copy of THIS repo's fallback
  # catalog (lib/catalog-data.ts + lib/catalog-extras-data.ts). The app repo
  # regenerates and diffs that copy in its own CI, but that check only runs on
  # app pushes: a website-only catalog change never triggers it, so the two
  # surfaces could drift silently (wrong /about numbers offline). This job
  # closes that gap by regenerating the app's copy FROM this checkout and
  # failing when the committed copy differs.
  catalog-parity:
    name: App bundled catalog matches this repo
    runs-on: self-hosted
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      # The read-only cross-repository secret grants access to the private app.
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: genumsolutions/genumsolutions-app-V4
          path: app
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install app dependencies
        working-directory: app/mobile
        run: npm ci

      # The generator lives in the app and imports this repo's data files
      # directly, so no website build/install is needed. Path: from
      # app/mobile, "../.." is the workspace root (this website checkout).
      - name: Regenerate the app catalog from this checkout
        working-directory: app/mobile
        run: npx --yes tsx scripts/generate-bundled-catalog.mts --website ../..

      - name: Fail when the app copy is stale
        working-directory: app
        run: |
          if ! git diff --quiet -- mobile/src/config/bundledProducts.ts; then
            echo "::error::mobile/src/config/bundledProducts.ts is stale — this website catalog change is not mirrored into the app. From genumsolutions-app/mobile run 'npx tsx scripts/generate-bundled-catalog.mts' and commit the result."
            git diff --stat -- mobile/src/config/bundledProducts.ts
            git --no-pager diff -- mobile/src/config/bundledProducts.ts | head -80
            exit 1
          fi
          echo "app bundled catalog matches this website's fallback catalog"

  edge-relay:
    name: Edge function typecheck (car-relay)
    runs-on: self-hosted
    permissions:
      contents: read
    # tsconfig.json EXCLUDES supabase/functions, so the car-relay edge function
    # is invisible to `npm run typecheck` - and an edge function that does not
    # compile is not a rounding error: it deploys, and then every WS upgrade
    # fails at runtime with nothing in CI red. This job is the only thing that
    # type-checks it.
    #
    # It was advisory (continue-on-error) for exactly one run, because this
    # bench has no Deno and an unproven gate is not a gate. First clean run on
    # 2026-10-05 (run 37282380295, 495bae4): green. It now BLOCKS, and a
    # failure here is a real failure - index.ts compiles nowhere else.
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check the relay function and its pure core
        run: deno check supabase/functions/car-relay/index.ts
      # Formatting is NOT re-checked here: prettier owns it repo-wide (a second
      # formatter with different defaults would be a second source of truth).

  # Live schema drift — every table and column in supabase/schema.sql must exist
  # in the DEPLOYED database. The 2026-11-07 project move left 6 of 39 tables and
  # no profiles.tier; the combined select(role, tier) then failed as a whole, so
  # every staff/admin account resolved as a customer and signed-in users saw the
  # signup form. Typecheck, lint and 318 tests all stayed green because nothing
  # here ever looked at the live project. `scripts/db-drift-check.mjs` does,
  # through PostgREST (404/PGRST205 = missing table, 400/42703 = missing column).
  #
  # Deliberately NOT part of `npm run test:ci`: that suite must stay offline and
  # reproducible. This job only needs Node (no npm ci - the script has no deps).
  #
  # With the credentials present this is a real gate: any live/schema mismatch
  # fails the run. Without them it skips with a warning instead of going red -
  # repo secrets can only be added by someone with admin rights on the repo, so
  # a red X here is a to-do for the owner, not a code defect, and a permanently
  # failing job trains everyone to ignore CI. `npm run db:drift` does the same
  # check locally.
  db-drift:
    name: Live database matches schema.sql
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::Fork PR: Actions secrets are unavailable by design, so the live schema was NOT checked."
          else
            echo "::warning::Live schema check skipped: add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings -> Secrets and variables -> Actions to turn this gate on."
          fi
          {
            echo "### Live schema check skipped"
            echo ""
            echo "No \`NEXT_PUBLIC_SUPABASE_URL\` / \`SUPABASE_SERVICE_ROLE_KEY\` Actions secret, so \`supabase/schema.sql\` was not compared with the live project."
            echo "Run \`npm run db:drift\` locally to get the same answer."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Check the live database against schema.sql
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run db:drift

  # Order items contract — the website and the app write the SAME Supabase
  # orders.items JSON. They drifted once: the app wrote `priceNpr` while this
  # client read `price`, so app orders rendered as "NPR NaN" here. Unit tests
  # can only see their own repo's copy, so each repo ships a verbatim contract
  # file and this job fails when the two copies differ.
  order-items-contract:
    name: Order items contract matches the app
    runs-on: self-hosted
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      # The read-only cross-repository secret grants access to the private app.
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: genumsolutions/genumsolutions-app-V4
          path: app
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Fail when the copies differ
        run: |
          if ! diff -u supabase/order-items.contract.json app/mobile/src/config/order-items.contract.json; then
            echo "::error::The orders.items contract copies differ. Copy supabase/order-items.contract.json verbatim to the app's mobile/src/config/order-items.contract.json, and update both repos' writers/tests in the same change."
            exit 1
          fi
          echo "orders.items contract matches the app"

  # Test residue in the LIVE database — harness auth users + their orders, and
  # the device rows the bench rounds wrote (fixture board ids, RFC 5737
  # TEST-NET addresses, "genumtest" SSIDs). Until this job existed those rows
  # were removed by hand, if at all, and the admin Users tab showed them as if
  # they were customers and cars.
  #
  # Same credential rule as db-drift: with the two secrets this is a real gate
  # (it stays red while residue exists); without them it skips with a warning,
  # because a missing repo secret is an owner to-do, not a code defect.
  #
  # To clean it: Actions -> DB hygiene -> Run workflow (apply=true), or
  # `npm run db:residue:apply` locally.
  db-hygiene:
    name: Live database has no test residue
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::Fork PR: Actions secrets are unavailable by design, so live DB residue was NOT checked."
          else
            echo "::warning::Live DB residue check skipped: add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings -> Secrets and variables -> Actions."
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Report test residue (fails when any exists)
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-test-residue.mjs --fail-on-residue
